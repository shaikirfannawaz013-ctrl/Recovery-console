server:
  port: 8080

spring:
  application:
    name: payment-recovery
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payment_recovery}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:prp}
    password: ${DB_PASSWORD:prp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # use Flyway/Liquibase migrations for production
    properties:
      hibernate:
        jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 30s         # dashboard numbers may be up to 30 s old
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

app:
  timezone: Asia/Kolkata
  jwt:
    # base64 key of at least 32 bytes; ALWAYS override JWT_SECRET outside local dev
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1wYXltZW50LXJlY292ZXJ5LXBsYXRmb3Jt}
    access-ttl: 15m
    refresh-ttl: 7d
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ml:
    base-url: ${ML_URL:http://localhost:8000}
    timeout: 2s
  topics:
    transactions: payments.transactions
    recovery-events: recovery.events
  retry:
    poll-interval-ms: 15000
    batch-size: 50
  fraud:
    anomaly-threshold: 0.75
    velocity-limit: 5
  duplicates:
    window: 3m
  demo:
    seed-history: ${DEMO_SEED:true}
    traffic: ${DEMO_TRAFFIC:true}
    traffic-interval-ms: 4000

logging:
  level:
    org.apache.kafka: WARN
